  <title id="title">Gestão Financeira Pessoal</title>
  <desc id="description">Aplicação Full Stack com autenticação JWT e refresh token, contas, categorias, movimentações, dashboard, controle de veículos e abastecimentos. Angular, NestJS, TypeScript, MongoDB, Mongoose, Docker e Swagger.</desc>
